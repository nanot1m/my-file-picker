name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package
        run: make dist VERSION=${GITHUB_REF_NAME#v}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/dist/* \
            --title "File Picker $GITHUB_REF_NAME" \
            --generate-notes
